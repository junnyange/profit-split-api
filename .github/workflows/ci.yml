# push와 PR마다: 테스트 → API/화면 빌드 → Docker 이미지 빌드(amd64, arm64).
# 이미지를 저장소에 올리거나 서버에 배포하지는 않는다 (빌드가 되는지만 확인).
name: CI

on:
  push:
  pull_request:

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm ci --prefix web
      - run: npm test
      - run: npm run build
      - run: npm run build --prefix web

  docker:
    needs: test-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # arm64 단계(프로덕션 의존성 설치)를 x86 러너에서 돌리기 위한 에뮬레이터
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
